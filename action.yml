name: 'translate-robot: i18n translations that fit the UI'
description: >-
  Translate new i18n strings to fit the real rendered width of each UI component. Opens a PR for human review.
author: 'fiaaaansoo'
branding:
  icon: 'globe'
  color: 'blue'

inputs:
  repo:
    description: 'Path to the target repo checkout (defaults to the Action workspace).'
    required: false
    default: ${{ github.workspace }}
  owner:
    description: 'GitHub repository owner. Defaults to the owner of the repo this Action runs in.'
    required: false
  repo-name:
    description: 'GitHub repository name. Defaults to the name of the repo this Action runs in.'
    required: false
  base-branch:
    description: 'Base branch to diff against and to open the pull request against.'
    required: false
    default: 'main'
  old-i18n:
    description: 'Path to the i18n catalog as it existed on base-branch. Omit to resolve it automatically from git.'
    required: false
  new-i18n:
    description: 'Path to the i18n catalog after the change.'
    required: false
    default: 'i18n/en.json'
  mapping:
    description: 'Path to the key -> component mapping file.'
    required: false
    default: 'i18n-map.json'
  i18n-target:
    description: 'Path to the target locale file to write. Defaults to i18n/<target-locale>.json.'
    required: false
  target-locale:
    description: 'Target locale to translate into.'
    required: false
    default: 'de'
  dry-run:
    description: 'Extract, translate, and measure only - write nothing, open no pull request.'
    required: false
    default: 'false'
  recorded-translations:
    description: 'Path to a pre-recorded translations file, for demos/tests without a real LLM call.'
    required: false
  anthropic-api-key:
    description: 'Anthropic API key. Used unless llm-provider is openai-compatible, or dry-run with recorded-translations. Never logged.'
    required: false
  llm-provider:
    description: 'Translation backend: anthropic (default) or openai-compatible (a self-hosted Ollama/vLLM/etc. server - source text is sent only to the server at llm-base-url).'
    required: false
    default: 'anthropic'
  llm-base-url:
    description: 'Base URL of an OpenAI-compatible chat completions API. Required when llm-provider is openai-compatible.'
    required: false
  llm-model:
    description: 'Model name for the selected provider. Required when llm-provider is openai-compatible; optional override otherwise.'
    required: false
  llm-api-key:
    description: 'API key for the openai-compatible provider, if the self-hosted server requires one. Never logged.'
    required: false
  github-token:
    description: 'GitHub token used to push the translation branch and open the pull request. Never logged.'
    required: true

runs:
  using: 'composite'
  steps:
    # github.action_path keeps a literal "/." segment when this action is
    # referenced locally (uses: ./, as in the demo workflow) - the glob
    # matcher behind setup-node's cache-dependency-path and hashFiles()
    # rejects any pattern containing a literal "." or ".." path segment,
    # so the path is normalized once here before either consumes it.
    - name: Resolve this action's own lockfile path
      id: resolve-lockfile
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: echo "path=$(realpath "$ACTION_PATH/package-lock.json")" >> "$GITHUB_OUTPUT"

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ${{ steps.resolve-lockfile.outputs.path }}

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles(steps.resolve-lockfile.outputs.path) }}

    - name: Install translate-robot
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci
        npx playwright install --with-deps chromium
        npm run build

    - name: Configure git identity for the commit this Action makes
      # Only needed outside dry-run: dry-run never calls git commit.
      # A fresh Actions runner has no git identity configured by
      # default, and the GitClient (src/pr/git.ts) deliberately relies
      # on ambient git config rather than setting one itself - that is
      # correct for a developer's own machine, where it is already
      # configured, but this Action's own job to provide on a runner.
      if: ${{ inputs.dry-run != 'true' }}
      shell: bash
      working-directory: ${{ inputs.repo }}
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

    - name: Resolve the base-branch i18n catalog
      id: resolve-old-i18n
      shell: bash
      working-directory: ${{ inputs.repo }}
      env:
        INPUT_OLD_I18N: ${{ inputs.old-i18n }}
        INPUT_NEW_I18N: ${{ inputs.new-i18n }}
        INPUT_BASE_BRANCH: ${{ inputs.base-branch }}
      run: |
        if [ -n "$INPUT_OLD_I18N" ]; then
          echo "path=$INPUT_OLD_I18N" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # No explicit --old-i18n: resolve the pre-change catalog from git
        # itself (this Action's own job - the CLI just diffs two files on
        # disk and has no git-ref concept). A missing file on base-branch
        # (first-ever add) is not an error - the CLI already treats a
        # missing/omitted old-i18n path as an empty catalog.
        resolved="$(mktemp)"
        if git show "origin/$INPUT_BASE_BRANCH:./$INPUT_NEW_I18N" > "$resolved" 2>/dev/null; then
          echo "path=$resolved" >> "$GITHUB_OUTPUT"
        else
          echo "path=" >> "$GITHUB_OUTPUT"
        fi

    - name: Run translate-robot
      shell: bash
      working-directory: ${{ inputs.repo }}
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        TRANSLATE_ROBOT_LLM_API_KEY: ${{ inputs.llm-api-key }}
        # Inputs go through env vars, never interpolated into the script,
        # so an untrusted value cannot inject shell commands.
        INPUT_NEW_I18N: ${{ inputs.new-i18n }}
        INPUT_MAPPING: ${{ inputs.mapping }}
        INPUT_TARGET_LOCALE: ${{ inputs.target-locale }}
        INPUT_BASE_BRANCH: ${{ inputs.base-branch }}
        INPUT_OWNER: ${{ inputs.owner || github.repository_owner }}
        INPUT_REPO_NAME: ${{ inputs.repo-name || github.event.repository.name }}
        INPUT_LLM_PROVIDER: ${{ inputs.llm-provider }}
        INPUT_OLD_I18N_RESOLVED: ${{ steps.resolve-old-i18n.outputs.path }}
        INPUT_I18N_TARGET: ${{ inputs.i18n-target }}
        INPUT_RECORDED: ${{ inputs.recorded-translations }}
        INPUT_LLM_BASE_URL: ${{ inputs.llm-base-url }}
        INPUT_LLM_MODEL: ${{ inputs.llm-model }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        args=(
          run
          --repo .
          --new-i18n "$INPUT_NEW_I18N"
          --mapping "$INPUT_MAPPING"
          --target-locale "$INPUT_TARGET_LOCALE"
          --base-branch "$INPUT_BASE_BRANCH"
          --owner "$INPUT_OWNER"
          --repo-name "$INPUT_REPO_NAME"
          --llm-provider "$INPUT_LLM_PROVIDER"
        )
        if [ -n "$INPUT_OLD_I18N_RESOLVED" ]; then
          args+=(--old-i18n "$INPUT_OLD_I18N_RESOLVED")
        fi
        if [ -n "$INPUT_I18N_TARGET" ]; then
          args+=(--i18n-target "$INPUT_I18N_TARGET")
        fi
        if [ -n "$INPUT_RECORDED" ]; then
          args+=(--recorded-translations "$INPUT_RECORDED")
        fi
        if [ -n "$INPUT_LLM_BASE_URL" ]; then
          args+=(--llm-base-url "$INPUT_LLM_BASE_URL")
        fi
        if [ -n "$INPUT_LLM_MODEL" ]; then
          args+=(--llm-model "$INPUT_LLM_MODEL")
        fi
        if [ "$INPUT_DRY_RUN" = "true" ]; then
          args+=(--dry-run)
        fi
        node "$ACTION_PATH/bin/translate-robot" "${args[@]}"
