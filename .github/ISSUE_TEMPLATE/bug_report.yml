name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what you got. Include the exact command or Action step.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: translate-robot version or commit, Node.js version, OS, LLM provider (Anthropic or openai-compatible).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: Relevant log output. Redact any token or API key.
      render: text
