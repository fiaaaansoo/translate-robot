name: Feature request
description: Suggest an improvement (new locale, catalog format, provider)
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that translate-robot does not support today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: Optional. Known v1 limits are listed in the README.
